services:
  - type: web
    name: tpn-loy-krathong-festival
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
    disk:
      name: wishes
      mountPath: /var/data
      sizeGB: 1
