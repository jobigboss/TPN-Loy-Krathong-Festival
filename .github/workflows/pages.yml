name: Publish festival to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Wait for Pages artifact to become available
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.info('Pages artifact is available.');
                return;
              }
              core.info('Waiting for GitHub to index the Pages artifact...');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Pages artifact is not available yet. Re-run this workflow.');
      - id: deployment
        uses: actions/deploy-pages@v4
